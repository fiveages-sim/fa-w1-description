/**:
  ros__parameters:
    # 线性控制缩放因子（用于手柄/键盘控制）
    linear_scale: 0.01

    # 角度控制缩放因子（用于手柄/键盘控制）
    angular_scale: 0.005

    # Split-body RViz / interactive markers: live TF root of the full W1 robot.
    # full_body launch 在 wbc_available 时会覆盖为 world。
    marker_fixed_frame: base_footprint
    vr_follow_frame: base_footprint
    # 是否启用VR输入处理
    enable_vr: true
    enable_head_control: false

    head_joint_to_rpy_mapping:
      head_joint1: "head_yaw"
      head_joint2: "head_pitch"

    head_rpy_axis_direction:
      head_yaw: 1.0
      head_pitch: 1.0
      head_roll: 1.0

    head_link_name: "head_link2"
