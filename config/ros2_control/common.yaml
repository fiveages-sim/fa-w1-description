# Common controller defaults for FiveAges W1 (differential wheeled humanoid).
#
#   full_body:
#     - 差速底盘 SE(2) + 腰/头/双臂：ocs2_wbc_controller（task.info）
#   split_body:
#     - 双臂：ocs2_arm_controller（dual_arm.info，规划 topology:=dual）
#     - 腰 / 头：body_joint_controller / head_joint_controller

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    ocs2_wbc_controller:
      type: ocs2_wbc_controller/Ocs2WbcController

    head_joint_controller:
      type: basic_joint_controller/BasicJointController

    body_joint_controller:
      type: basic_joint_controller/BasicJointController

    left_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    right_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    left_hand_controller:
      type: basic_joint_controller/BasicJointController

    right_hand_controller:
      type: basic_joint_controller/BasicJointController

ocs2_arm_controller:
  ros__parameters:
    update_rate: 100  # Hz
    mpc_frequency: 50
    info_file_name: dual_arm
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: fiveages_w1
    robot_type: dual
    left_ee_frame: left_eef
    right_ee_frame: right_eef
    home_duration: 5.0
    movel_trajectory_duration: 6.0
    movej_interpolation_type: doubles
    home_interpolation_type: doubles

    cartesian_defaults:
      frame_id: arm_base
      ik_type: AUTO
      max_linear_velocity: 0.3
      max_linear_acceleration: 1.0
      max_linear_jerk: 5.0
      max_angular_velocity: 0.5
      max_angular_acceleration: 1.0
      max_angular_jerk: 5.0

    home_1: [0.15622096296502086, 1.3238529836625905, -1.4301957224137667, 1.0916780405656537, -0.28819400399453565, 0.4850972160345252, -0.019370582083524043,
             -0.2524111457453749, 1.26093480422406, 1.4309639112302, 1.275244008708472, 0.27915478251742143, 0.41046785228139826, 0.003618996236919578]
    home_2: [0.0, 1.5708, -1.5708, 0.4, -0.4, 0.4, 0.0,
             0.0, 1.5708, 1.5708, 0.4, 0.4, 0.4, 0.0]

ocs2_wbc_controller:
  ros__parameters:
    use_tf_for_base: true
    tf_topic: /tf
    world_frame: world
    base_frame: base_footprint
    update_rate: 100  # Hz
    mpc_frequency: 50
    info_file_name: task
    left_ee_frame: left_eef
    right_ee_frame: right_eef
    fsm_default_humanoid_mode: HM_DUAL_RELATIVE_MOBILE_BASE
    # 关节顺序须与 Pinocchio / task.info 的 arm 状态向量一致：
    # [body_joint1~4 | left_joint1~7 | right_joint1~7 | head_joint1~2]
    # 底盘 x,y,yaw 是虚拟状态，不在 joints 列表中
    # manipulatorModelType=1：底盘输入为 [v, omega]（2 维）
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
      - body_joint4
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
      - head_joint1
      - head_joint2

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: fiveages_w1
    home_duration: 5.0

    waist_lifting_enabled: true
    waist_lifting_duration: 3.0
    waist_lifting_type: three_joint
    waist_l1: 0.327
    waist_l2: 0.275
    waist_rotation_direction: [1.0, -1.0, 1.0]
    waist_angle_offset: [0.0, 0.0, 0.0]
    waist_lifting_default_parameter: [0.02, 0.5, 1.0]
    waist_turning_default_parameter: [0.2, 0.5, 1.0]
    waist_phi_default_parameter: [0.2, 0.5, 1.0]

    cartesian_defaults:
      frame_id: arm_base
      ik_type: AUTO
      max_linear_velocity: 0.3
      max_linear_acceleration: 1.0
      max_linear_jerk: 5.0
      max_angular_velocity: 0.5
      max_angular_acceleration: 1.0
      max_angular_jerk: 5.0

    # task.info arm: [body x4 | left x7 | right x7 | head x2]
    home_1: [1.0145214890243484, -2.248923594021317, -1.2333776023323322, 0.0,
             0.15622096296502086, 1.3238529836625905, -1.4301957224137667, 1.0916780405656537, -0.28819400399453565, 0.4850972160345252, -0.019370582083524043,
             -0.2524111457453749, 1.26093480422406, 1.4309639112302, 1.275244008708472, 0.27915478251742143, 0.41046785228139826, 0.003618996236919578,
             0.0, -0.75]
    home_2: [0.6810335903307411, -1.5096724218776123, -0.8279494910068607, 0.0,
             0.0, 1.5708, -1.5708, 0.4, -0.4, 0.4, 0.0,
             0.0, 1.5708, 1.5708, 0.4, 0.4, 0.4, 0.0,
             0.0, 0.0]

head_joint_controller:
  ros__parameters:
    update_rate: 100  # Hz
    joints:
      - head_joint1
      - head_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    home_duration: 5.0
    movej_duration: 3.0
    hold_position_threshold: 0.1
    home_1: [0.0, -0.75]
    home_2: [0.0, 0.0]
    home_3: [0.0, 0.0]
    home_4: [0.0, 0.0]

body_joint_controller:
  ros__parameters:
    update_rate: 100  # Hz
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
      - body_joint4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    home_duration: 5.0
    movej_duration: 3.0
    hold_position_threshold: 0.1
    movej_interpolation_type: doubles
    home_1: [1.0145214890243484, -2.248923594021317, -1.2333776023323322, 0.0]
    home_2: [0.6810335903307411, -1.5096724218776123, -0.8279494910068607, 0.0]
    waist_lifting_enabled: true
    waist_lifting_duration: 3.0
    waist_lifting_type: three_joint
    waist_l1: 0.327
    waist_l2: 0.275
    waist_rotation_direction: [1.0, -1.0, 1.0]
    waist_angle_offset: [0.0, 0.0, 0.0]
    waist_lifting_default_parameter: [0.02, 0.5, 1.0]
    waist_turning_default_parameter: [0.2, 0.5, 1.0]
    waist_phi_default_parameter: [0.2, 0.5, 1.0]

left_gripper_controller:
  ros__parameters:
    joint: left_gripper_joint
    use_effort_interface: false

right_gripper_controller:
  ros__parameters:
    joint: right_gripper_joint
    use_effort_interface: false
