# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 差速驱动控制器 - 用于轮子
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # 双臂控制器 - 使用ocs2 arm controller
    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    # 全身控制器 - 使用ocs2 arm controller
    ocs2_wbc_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    # 头部控制器 - 使用basic joint controller
    head_joint_controller:
      type: basic_joint_controller/BasicJointController

    # 身体控制器 - 使用basic joint controller
    body_joint_controller:
      type: basic_joint_controller/BasicJointController

    # 左手夹爪控制器
    left_hand_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    # 右手夹爪控制器
    right_hand_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

# 差速驱动控制器配置
diff_drive_controller:
  ros__parameters:
    update_rate: 50  # Hz

    # 轮子关节
    left_wheel_names: ["chassis_left_joint"]
    right_wheel_names: ["chassis_right_joint"]

    # 轮子间距
    wheel_separation: 0.3692  # 左右轮间距 (从URDF计算: 0.1846 - (-0.1846))
    wheel_radius: 0.0842     # 轮子半径 (从mesh文件推断)

    # 限制参数
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 5.0
    enable_odom_tf: false


ocs2_arm_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 100  # Hz
    mpc_frequency: 25
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: rokae_ar5
    robot_type: dual_leapmotor
    info_file_name: dual
    home_duration: 5.0

    # Control parameters
    home_pos: [ 0.15622096296502086, 1.3238529836625905, -1.4301957224137667, 1.0916780405656537, -0.28819400399453565, 0.4850972160345252, -0.019370582083524043,
                -0.2524111457453749, 1.26093480422406, 1.4309639112302, 1.275244008708472, 0.27915478251742143, 0.41046785228139826, 0.003618996236919578]
    rest_pos: [ 0.0, 1.5708, -1.5708, 0.4, -0.4, 0.4, 0.0,
                0.0, 1.5708, 1.5708, 0.4, 0.4, 0.4, 0.0 ]

ocs2_wbc_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 100  # Hz
    mpc_frequency: 25
    info_file_name: fixed_base
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
      - body_joint4
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: fiveages_w1
    robot_type: srs_leapmotor
    home_duration: 5.0

    # Control parameters
    home_pos: [ 1.0145214890243484, -2.248923594021317, -1.2333776023323322, 0.0,
                0.15622096296502086, 1.3238529836625905, -1.4301957224137667, 1.0916780405656537, -0.28819400399453565, 0.4850972160345252, -0.019370582083524043,
                -0.2524111457453749, 1.26093480422406, 1.4309639112302, 1.275244008708472, 0.27915478251742143, 0.41046785228139826, 0.003618996236919578]
    rest_pos: [ 0.6810335903307411, -1.5096724218776123, -0.8279494910068607, 0.0,
                0.0, 1.5708, -1.5708, 0.4, -0.4, 0.4, 0.0,
                0.0, 1.5708, 1.5708, 0.4, 0.4, 0.4, 0.0 ]

# 头部关节控制器配置
head_joint_controller:
  ros__parameters:
    update_rate: 100  # Hz

    # 头部关节
    joints:
      - head_joint1
      - head_joint2

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # 三组不同的 home pose 配置
    # 使用 home_1, home_2, home_3 参数命名规则
    home_1: [0.0, -0.3]           # 配置 0: 正视前方
    home_2: [0.0, 0.0]        # 配置 1: 向左看约 -45度

    home_duration: 5.0
    move_duration: 3.0
    hold_position_threshold: 0.1
    switch_command_base: 4

body_joint_controller:
  ros__parameters:
    update_rate: 100  # Hz

    # 身体关节
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
      - body_joint4

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # 三组不同的 home pose 配置
    # 使用 home_1, home_2, home_3 参数命名规则
    home_1: [1.0145214890243484, -2.248923594021317, -1.2333776023323322, 0.0]
    home_2: [0.6810335903307411, -1.5096724218776123, -0.8279494910068607, 0.0]

    home_duration: 5.0
    move_duration: 3.0
    hold_position_threshold: 0.1
    switch_command_base: 4

# 左手夹爪控制器配置
left_hand_controller:
  ros__parameters:
    joint: left_gripper_joint
    force_feedback_ratio: 0.1
    force_threshold: 1.5

# 右手夹爪控制器配置
right_hand_controller:
  ros__parameters:
    joint: right_gripper_joint
    force_feedback_ratio: 0.1
    force_threshold: 1.5

